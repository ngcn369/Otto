<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You Won a Prize! \ud83c\udf89</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFE234;
      --pink: #FF3CAC;
      --blue: #2BD9FE;
      --green: #39FF14;
      --orange: #FF6B00;
      --bg: #0d0d1a;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(255,60,172,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(43,217,254,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 60% 80%, rgba(255,226,52,0.1) 0%, transparent 60%);
      animation: bgPulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes bgPulse {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* \u2500\u2500 CONFETTI \u2500\u2500 */
    #confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }

    /* \u2500\u2500 SCREENS \u2500\u2500 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 24px;
      position: relative;
      z-index: 10;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .screen.active { display: flex; }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.7) rotate(-3deg); }
      to   { opacity:1; transform: scale(1) rotate(0deg); }
    }

    /* \u2500\u2500 SCREEN 1: Winner \u2500\u2500 */
    .trophy {
      font-size: 100px;
      animation: bounce 0.8s ease infinite alternate;
      filter: drop-shadow(0 0 30px rgba(255,226,52,0.8));
      line-height: 1;
      margin-bottom: 12px;
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-18px) scale(1.08); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(36px, 8vw, 72px);
      background: linear-gradient(135deg, var(--yellow), var(--pink), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 10px;
      text-shadow: none;
    }

    .subtitle {
      font-size: clamp(16px, 3vw, 22px);
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      margin-bottom: 28px;
      max-width: 420px;
    }

    .prize-badge {
      background: linear-gradient(135deg, #FFE234, #FF6B00);
      border-radius: 20px;
      padding: 18px 36px;
      margin-bottom: 28px;
      box-shadow: 0 0 40px rgba(255,226,52,0.5), 0 0 80px rgba(255,107,0,0.3);
      animation: glowPulse 1.5s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 40px rgba(255,226,52,0.5), 0 0 80px rgba(255,107,0,0.3); }
      50%      { box-shadow: 0 0 60px rgba(255,226,52,0.8), 0 0 120px rgba(255,107,0,0.5); }
    }
    .prize-badge p {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 4vw, 28px);
      color: #0d0d1a;
      line-height: 1.2;
    }
    .prize-badge .prize-amount {
      font-size: clamp(36px, 7vw, 58px);
      display: block;
    }

    .timer-wrap {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 14px 28px;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }
    .timer-label { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
    .timer-digits {
      font-family: 'Fredoka One', cursive;
      font-size: 42px;
      color: var(--yellow);
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(255,226,52,0.6);
    }
    #countdown { display: inline-block; min-width: 80px; }

    .claim-btn {
      background: linear-gradient(135deg, var(--pink), #784ba0, var(--blue));
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 18px 48px;
      font-family: 'Fredoka One', cursive;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(255,60,172,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    .claim-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    }
    .claim-btn:hover { transform: scale(1.06) translateY(-2px); box-shadow: 0 16px 48px rgba(255,60,172,0.7); }
    .claim-btn:active { transform: scale(0.97); }

    .fine-print {
      font-size: 10px; color: rgba(255,255,255,0.25);
      max-width: 340px; line-height: 1.5;
    }

    /* \u2500\u2500 SCREEN 2: Fake Loading \u2500\u2500 */
    .loading-icon { font-size: 70px; margin-bottom: 16px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title {
      font-family: 'Fredoka One', cursive;
      font-size: 32px; color: var(--blue);
      margin-bottom: 10px;
    }
    .loading-sub { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 28px; }
    .progress-bar-wrap {
      width: 320px; max-width: 90vw;
      background: rgba(255,255,255,0.08);
      border-radius: 50px; height: 18px;
      overflow: hidden; margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .progress-bar-fill {
      height: 100%; border-radius: 50px;
      background: linear-gradient(90deg, var(--pink), var(--blue), var(--green));
      background-size: 200% 100%;
      animation: shimmer 1s linear infinite;
      transition: width 0.3s ease;
      width: 0%;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .progress-label { font-size: 13px; color: rgba(255,255,255,0.4); }
    .step-list { margin-top: 18px; text-align: left; width: 320px; max-width: 90vw; }
    .step-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: rgba(255,255,255,0.4);
      padding: 5px 0;
      transition: color 0.3s;
    }
    .step-item.done { color: var(--green); }
    .step-icon { width: 18px; text-align: center; }

    /* \u2500\u2500 SCREEN 3: "Info" Form \u2500\u2500 */
    .form-wrap {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 32px 28px;
      width: 380px; max-width: 92vw;
      backdrop-filter: blur(12px);
    }
    .form-title {
      font-family: 'Fredoka One', cursive;
      font-size: 28px; color: var(--yellow);
      margin-bottom: 6
