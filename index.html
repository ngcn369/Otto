<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #050505; /* Deep dark background */
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* Screen Management */
    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* Button Styles */
    button {
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #ffffff;
      color: #050505;
    }

    /* Square Button (Screen 1) */
    .square-btn {
      width: 120px;
      height: 120px;
      text-transform: lowercase;
    }

    /* Rectangle Buttons (Screen 2) */
    .btn-container {
      display: flex;
      gap: 30px; /* Space between the two buttons */
    }

    .rect-btn {
      width: 160px;
      height: 50px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

  <div id="screen-1" class="screen active">
    <button class="square-btn" onclick="nextScreen(2)">click</button>
  </div>

  <div id="screen-2" class="screen">
    <div class="btn-container">
      <button class="rect-btn" onclick="nextScreen(3)">Male</button>
      <button class="rect-btn" onclick="nextScreen(3)">Female</button>
    </div>
  </div>

  <div id="screen-3" class="screen">
    </div>

  <script>
    // Logic to switch between screens
    function nextScreen(screenNumber) {
      // Hide all screens
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      // Show the targeted screen
      document.getElementById('screen-' + screenNumber).classList.add('active');
    }
  </script>

</body>
</html>
